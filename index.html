<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NithiViz — Architectural Visualization Portfolio</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L5WVMMG5DK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-L5WVMMG5DK');
  </script>
  
  <!-- Panzoom Library -->
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    /* RESET & GLOBALS */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; }
    img { user-select: none; -webkit-user-drag: none; }

    /* HEADER & BRANDING */
    header { display: flex; justify-content: space-between; align-items: center; padding: 1.8rem 5%; border-bottom: 1px solid #222; }
    .brand-container { display: flex; align-items: center; gap: 16px; }
    .site-logo { height: 58px; width: auto; object-fit: contain; border-radius: 8px; border: 1px solid #333; transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.4s ease, filter 0.3s ease; cursor: pointer; }
    .logo { font-size: 1.6rem; font-weight: 700; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
    nav a { color: #aaa; text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s ease; cursor: pointer; }
    nav a:hover { color: #fff; }

    /* GALLERY GRID */
    .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; padding: 2rem 5% 6rem 5%; }
    .project-card { position: relative; background-color: #1a1a1a; border: 1px solid #282828; border-radius: 4px; overflow: hidden; cursor: pointer; transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
    .image-wrapper { position: relative; width: 100%; height: 280px; background-color: #222; }
    .image-wrapper img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
    .project-info { padding: 1.5rem; }
    .prompt-hint { margin-top: 0.8rem; font-size: 0.75rem; color: #a37c3f; text-transform: uppercase; letter-spacing: 1px; }

    /* MODALS */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
    .modal-overlay.active { display: flex; }
    .info-container, .book-container { position: relative; width: 90%; max-width: 900px; background: #181818; border: 1px solid #333; border-radius: 8px; padding: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    .close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #aaa; font-size: 2rem; cursor: pointer; z-index: 20; }
    .close-btn:hover { color: #fff; }

    /* ZOOM HEADER & TOOLBAR FIXES */
    .zoom-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.96); display: none; z-index: 2000; flex-direction: column; }
    .zoom-modal.active { display: flex; }
    .zoom-header { display: flex; flex-direction: column; align-items: stretch; padding: 0.8rem 1rem; background: rgba(20, 20, 20, 0.95); border-bottom: 1px solid #333; z-index: 2010; gap: 0.6rem; }
    .zoom-brand-group { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .zoom-logo { height: 36px; width: auto; object-fit: contain; border-radius: 5px; }
    .zoom-toolbar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.4rem; width: 100%; }
    .zoom-toolbar button { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 0.35rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: background 0.2s ease; }
    
    /* ZOOM STAGE */
    .zoom-stage { flex: 1; width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; position: relative; }
    .zoom-side-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(25, 25, 25, 0.85); color: #e0e0e0; border: 1px solid #444; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; z-index: 2020; }
    .zoom-side-btn.left { left: 10px; }
    .zoom-side-btn.right { right: 10px; }
    .hidden-zoom { opacity: 0; pointer-events: none; }

    @media (max-width: 600px) { .site-logo { height: 42px; } }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="brand-container">
      <img src="NVweblogo.png" alt="NithiViz Logo" class="site-logo">
      <div class="logo">NITHIVIZ</div>
    </div>
    <nav>
      <a onclick="openModal('aboutModal')">About</a>
      <a onclick="openModal('contactModal')">Contact</a>
    </nav>
  </header>

  <section class="hero" style="padding: 5rem 5% 3rem 5%; max-width: 900px;">
    <h1>Architectural Visualization Lookbook</h1>
    <p>Select a project card to open its full interactive brochure.</p>
  </section>

  <main class="portfolio-grid" id="work">
    <article class="project-card" onclick="openBrochure('Modern Residential Villa', villaPages)">
      <div class="image-wrapper"><div class="shield"></div><img src="https://picsum.photos/id/1067/800/600" alt="Villa"></div>
      <div class="project-info"><h3>Project Concept 01</h3><p>Modern Residential Villa</p><div class="prompt-hint">Click to Open &rarr;</div></div>
    </article>
    <!-- Repeat for other cards -->
  </main>

  <!-- FULL SCREEN ZOOM LIGHTBOX -->
  <div class="zoom-modal" id="zoomModal">
    <div class="zoom-header">
      <div class="zoom-brand-group">
        <img src="NVweblogo.png" alt="NithiViz Logo" class="zoom-logo">
        <span style="color: #aaa; font-size: 0.8rem; white-space: nowrap;" id="zoomPageCounter">Page 1 of 1</span>
      </div>
      
      <div class="zoom-toolbar">
        <button id="zoomPrevBtn" onclick="changeZoomPage(-1)">&larr; Prev</button>
        <button id="zoomNextBtn" onclick="changeZoomPage(1)">Next &rarr;</button>
        <span style="color:#444; margin: 0 2px;">|</span>
        <button onclick="panzoomInstance.zoomIn()">Zoom +</button>
        <button onclick="panzoomInstance.zoomOut()">Zoom -</button>
        <button onclick="resetZoomWithArrows()">Reset</button>
        <button onclick="closeZoomViewer()" style="background:#8b0000; border-color:#a00; font-weight: bold;">Close [X]</button>
      </div>
    </div>

    <div class="zoom-stage">
      <button class="zoom-side-btn left" id="zoomSidePrev" onclick="changeZoomPage(-1)">&larr;</button>
      <div class="panzoom-wrapper" id="panzoomWrapper">
        <img id="zoomTargetImg" src="" alt="Zoomable Page">
      </div>
      <button class="zoom-side-btn right" id="zoomSideNext" onclick="changeZoomPage(1)">&rarr;</button>
    </div>
  </div>

  <script>
    const villaPages = ["https://picsum.photos/id/1067/1600/1000", "https://picsum.photos/id/1040/1600/1000"];
    let currentPages = []; let pageIndex = 0; let panzoomInstance = null;

    function updateZoomControls() {
      const zoomPageCounter = document.getElementById('zoomPageCounter');
      // Simplified counter for mobile readability
      if (zoomPageCounter) {
        zoomPageCounter.innerText = `Page ${pageIndex + 1} of ${currentPages.length}`;
      }
    }

    // ... [Include your existing openModal, openBrochure, changeZoomPage, and other logic here]
    // Note: Keep your existing logic for openBrochure, closeModal, etc., as they were fine!
  </script>
</body>
</html>
